# Kopieren nach config.toml und anpassen.

[general]
quality = "720p60,720p,best"   # ca. 4 Mbit/s pro Stream; "best" (1080p) braucht ca. 8 Mbit/s pro Stream
buffer_seconds = 300    # lokaler Cache: letzte 5 Minuten pro Stream
segment_seconds = 10
pre_seconds = 55        # Material VOR dem Chat-Spike (Aufbau des Moments)
post_seconds = 25       # Material NACH dem Chat-Spike (Reaktion)
min_clip_seconds = 61   # Mindestlaenge; geschnitten wird auf Sprechpausen, nie kuerzer als das
min_score = 6           # niedriger = mehr Clips (5 = fast alles, 7 = nur starke Momente)
workers = 2             # parallele Clip-Renderer
language = ""           # Whisper-Sprache; "" = automatisch (Deutsch/Englisch je Streamer)
out_dir = "clips"
keep_rejected = false   # aussortierte Clips (unter min_score) als Roh-MP4 behalten

[detect]
window = 10             # Sekunden, in denen der Chat "explodieren" muss
baseline = 120          # Vergleichszeitraum fuer "normalen" Chat
factor = 3.0            # Chat muss x-mal schneller sein als normal (niedriger = mehr Clips)
min_messages = 8        # Mindestanzahl Nachrichten im Fenster (kleine Chats: 4-5)
cooldown = 40           # Mindestabstand zwischen zwei Clips pro Kanal

[ai]
whisper_model = "small"                 # "" = kein Transkript / keine Untertitel
ollama_url = "http://localhost:11434"
ollama_model = "llama3.1:8b"            # "" = nur Chat-Heuristik als Score

[telegram]
bot_token = ""          # oder Umgebungsvariable TELEGRAM_BOT_TOKEN
chat_id = ""            # herausfinden mit: python -m clipper telegram

# Automatisch die groessten Live-Streams eines Spiels clippen (offizielle Twitch-API).
# Zugangsdaten kostenlos unter https://dev.twitch.tv/console/apps (App registrieren, Typ "Confidential").
[auto]
enabled = false
games = ["Grand Theft Auto V", "Grand Theft Auto VI"]
top = 5                 # Anzahl Streams. Faustregel: Download-Mbit/s geteilt durch 5
languages = ["de", "en"] # nur deutsch- und englischsprachige Streams
refresh_minutes = 30    # neue Top-Streamer werden laufend dazugenommen
client_id = ""          # oder Umgebungsvariable TWITCH_CLIENT_ID
client_secret = ""      # oder TWITCH_CLIENT_SECRET

# Zusaetzlich oder stattdessen feste Kanaele: ein Block pro Streamer. cam = Facecam-Ausschnitt [x, y, breite, hoehe] als Anteil
# des Bildes (0-1). Ohne Angabe wird die Facecam automatisch per Gesichtserkennung gesucht.
# [[channel]]
# name = "streamer1"
# cam = [0.75, 0.0, 0.25, 0.25]
